<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار الرخصة المهنية - القسم التربوي</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--card:#fff;--tx:#1d2a2a;--mut:#667;--pri:#0f6b5c;--ok:#d9f2e3;--okb:#1e8a4c;--no:#fde3e1;--nob:#c0392b;--bd:#d9d6cc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191a;--card:#1d2526;--tx:#e8eeee;--mut:#9aa7a7;--pri:#3fc2a8;--ok:#173a28;--okb:#4fd68a;--no:#42201d;--nob:#ff7b6b;--bd:#334}}
:root[data-theme="dark"]{--bg:#14191a;--card:#1d2526;--tx:#e8eeee;--mut:#9aa7a7;--pri:#3fc2a8;--ok:#173a28;--okb:#4fd68a;--no:#42201d;--nob:#ff7b6b;--bd:#334}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.8}
main{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:8px 0;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-top:12px}
.bar{height:8px;background:var(--bd);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:8px 0}
.q{font-size:1.15rem;font-weight:700;margin-bottom:12px}
.opt{display:block;width:100%;text-align:right;font:inherit;color:inherit;background:var(--bg);border:2px solid var(--bd);border-radius:10px;padding:10px 14px;margin:8px 0;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}
.opt.ok{background:var(--ok);border-color:var(--okb)}
.opt.no{background:var(--no);border-color:var(--nob)}
button.main{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 22px;cursor:pointer;margin-top:10px}
:root[data-theme="dark"] button.main{color:#06201a}
.big{font-size:2.4rem;font-weight:800;color:var(--pri);text-align:center}
.rv{border-top:1px solid var(--bd);padding:10px 0;font-size:.95rem}
.rv b{color:var(--okb)}
select{font:inherit;padding:8px;border-radius:8px;background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
</style>
</head>
<body>
<main>
<h1>اختبار الرخصة المهنية للمعلمين – القسم التربوي</h1>
<div id="app"></div>
</main>
<script>
// الصيغة: السؤال|الإجابة الصحيحة|خيار خاطئ|خيار خاطئ|خيار خاطئ  (تُخلط الخيارات تلقائيًا)
const RAW=`رائد الاشتراط الكلاسيكي في المدرسة السلوكية هو:|بافلوف|سكنر|بياجيه|فيجوتسكي
صاحب نظرية الاشتراط الإجرائي هو:|سكنر|بافلوف|كوهلر|فرويد
رائد مدرسة التحليل النفسي هو:|فرويد|بياجيه|سكنر|كوهلر
من علماء المدرسة الجشطالتية:|كوهلر|سكنر|بافلوف|ثورندايك
تقوم نظرية الجشطالت على مبدأ:|الاستبصار والنظر إلى الكل قبل الجزء|التعلم بالتكرار والتعزيز|التعلم بالمحاولة والخطأ|التعلم بالتقليد فقط
صاحب نظرية النمو المعرفي ومراحله الأربع هو:|بياجيه|سكنر|بافلوف|واطسون
أولى مراحل النمو المعرفي عند بياجيه:|الحسية الحركية|ما قبل العمليات|العمليات المحسوسة|العمليات المجردة
يرتبط مفهوم منطقة النمو القريب بالعالم:|فيجوتسكي|سكنر|بافلوف|ثورندايك
صاحب نظرية التعلم الاجتماعي (التعلم بالملاحظة والنمذجة):|باندورا|سكنر|بافلوف|كوهلر
قانون الأثر ونظرية المحاولة والخطأ ينسبان إلى:|ثورندايك|فرويد|بياجيه|ماسلو
تؤكد النظرية البنائية على أن المتعلم:|يبني معرفته بنفسه|يتلقى المعرفة جاهزة|يحفظ المعلومات حرفيًا|يتعلم بالتعزيز فقط
إضافة مثير مرغوب بعد السلوك لزيادة تكراره تسمى:|تعزيزًا إيجابيًا|تعزيزًا سلبيًا|عقابًا|إطفاءً
إزالة مثير منفّر بعد السلوك لزيادة تكراره تسمى:|تعزيزًا سلبيًا|تعزيزًا إيجابيًا|عقابًا إيجابيًا|إطفاءً
المعلم الذي يتصرف كقدوة ويعتمد على الإرشاد والتوضيح والتوجيه هو المعلم:|المرشد|التقليدي|المفوِّض|الميسِّر
المعلم الذي يترك مسؤولية التعلم للطلاب ويقوم بدور المستشار هو المعلم:|المفوِّض|المرشد|التقليدي|الميسِّر
المعلم الذي يهتم بالمحتوى ولا يركز على الطالب هو المعلم:|التقليدي|المرشد|المفوِّض|الميسِّر
المعلم الذي يركز على الأنشطة ويتعامل بكفاءة مع الطلاب المتمكنين من المهارات هو:|الميسِّر|التقليدي|المرشد|المفوِّض
إعطاء الطالب قيمة رقمية (مثل 60 من 100) يسمى:|قياسًا|تقييمًا|تقويمًا|تشخيصًا
إعطاء الطالب تقديرًا لفظيًا (جيد) يسمى:|تقييمًا|قياسًا|تقويمًا|اختبارًا
إصدار حكم على الطالب واتخاذ قرار بعلاجه وتحسين أدائه يسمى:|تقويمًا|قياسًا|تقييمًا|إحصاءً
التقويم الذي يتم قبل بدء التدريس لمعرفة مستوى الطلاب السابق:|التقويم التشخيصي (القبلي)|التقويم البنائي|التقويم الختامي|التقويم الذاتي
التقويم الذي يُجرى أثناء التعلم بهدف تحسينه هو:|التقويم البنائي (التكويني)|التقويم الختامي|التقويم القبلي|التقويم النهائي
التقويم الذي يُجرى في نهاية الفصل لإصدار حكم على التحصيل هو:|التقويم الختامي|التقويم البنائي|التقويم التشخيصي|التقويم المستمر
المستويات الدنيا في تصنيف بلوم المعرفي هي:|التذكر والفهم والتطبيق|التحليل والتركيب والتقويم|التذكر والتحليل والإبداع|الفهم والتقويم والإبداع
أي الأفعال التالية يقيس مستوى الفهم؟|يفسّر|يعدّد|يصمم|يحكم
أي الأفعال التالية يقيس مستوى التطبيق؟|يحل مسألة بالقانون|يعرّف|يلخّص|يقيّم
أي الأفعال التالية يقيس مستوى التحليل؟|يقارن|يسمّي|يترجم|يحفظ
أي الأفعال التالية يقيس مستوى التركيب (الإبداع)؟|يصمّم|يذكر|يشرح|يحدد
أي الأفعال التالية يقيس مستوى التقويم؟|يحكم على جودة|يعدّد|يصف|يطبق
المجالات الرئيسة للأهداف التعليمية هي:|المعرفي والوجداني والنفس حركي|المعرفي والاجتماعي والبدني|اللغوي والرياضي والعلمي|النظري والعملي والإداري
الهدف «أن يقدّر الطالب قيمة العمل التطوعي» ينتمي للمجال:|الوجداني|المعرفي|النفس حركي|الاجتماعي
الهدف «أن يقفز الطالب الحاجز بالطريقة الصحيحة» ينتمي للمجال:|النفس حركي|المعرفي|الوجداني|اللغوي
أي الأهداف التالية صيغ بشكل سلوكي سليم؟|أن يعدّد الطالب ثلاثة أنواع من المثلثات|أن يفهم الطالب المثلثات|أن يُعلِّم المعلم المثلثات|دراسة المثلثات
الانتقال من الأمثلة والجزئيات إلى القاعدة العامة يسمى:|الاستقراء|الاستنباط|المحاضرة|المناقشة
الانتقال من القاعدة العامة إلى الأمثلة والتطبيقات يسمى:|الاستنباط|الاستقراء|الاستقصاء|الاكتشاف
أولى خطوات أسلوب حل المشكلات:|الإحساس بالمشكلة|اختبار الفروض|تعميم الحل|تقويم الحل
استراتيجية يُولِّد فيها الطلاب أكبر عدد من الأفكار دون نقد في البداية:|العصف الذهني|المحاضرة|الحوار الموجه|الاستقراء
تقسيم الطلاب إلى مجموعات صغيرة غير متجانسة لإنجاز مهمة مشتركة يمثل:|التعلم التعاوني|التعلم الفردي|المحاضرة|التعلم الذاتي فقط
استراتيجية يتقمص فيها الطلاب شخصيات ومواقف لفهم الموضوع:|لعب الأدوار|الاستقراء|المحاضرة|الاستنباط
في التعلم بالاكتشاف الموجه يكون دور المعلم:|توجيه الطلاب بأسئلة وتلميحات ليكتشفوا بأنفسهم|إلقاء المعلومات كاملة|ترك الطلاب دون أي توجيه|تصحيح الأخطاء فقط
من أسس التعلم النشط:|جعل الطالب محور العملية التعليمية|اعتبار المعلم ناقلًا للمعرفة|الاعتماد على الحفظ والتلقين|منع النقاش الصفي
يستخدم المنظم الشارح (لأوزبل) عندما تكون المادة الجديدة:|غير مألوفة للطالب|مألوفة للطالب|مكررة|سهلة جدًا
يستخدم المنظم المقارن عندما تكون المادة الجديدة:|مألوفة ويراد ربطها بالمعرفة السابقة|غير مألوفة تمامًا|بلا علاقة بما سبق|صعبة جدًا
صاحب نظرية الذكاءات المتعددة:|هوارد جاردنر|بياجيه|سكنر|ثورندايك
الطالب المتميز في القراءة والكتابة والتعبير يغلب عليه الذكاء:|اللغوي|المنطقي|الحركي|الموسيقي
أساس هرم ماسلو للحاجات هو الحاجات:|الفسيولوجية|الأمان|الاجتماعية|تحقيق الذات
قمة هرم ماسلو للحاجات هي:|تحقيق الذات|الأمان|الانتماء|التقدير
الدافعية الداخلية هي رغبة المتعلم في التعلم:|نابعة من ذاته ورغبته|بسبب المكافآت المادية|خوفًا من العقاب|إرضاءً للآخرين
لمراعاة الفروق الفردية بين الطلاب ينبغي للمعلم:|تنويع الأنشطة والأساليب|توحيد الأسلوب للجميع|التركيز على المتفوقين|إهمال الضعاف
أنسب تصرف مع طالب يتحدث أثناء الشرح:|الاقتراب منه وتوجيهه بهدوء|إخراجه من الفصل فورًا|السخرية منه|إيقاف الدرس وتوبيخه أمام الجميع
أنسب أسلوب لإدارة الصف هو:|وضع قواعد واضحة بمشاركة الطلاب|فرض قواعد صارمة دون نقاش|ترك الصف دون قواعد|الاعتماد على العقاب فقط
النمو المهني للمعلم هو:|عملية مستمرة لتطوير معارفه ومهاراته|حدث يتم مرة واحدة عند التعيين|مقتصر على الدورات الإدارية|ترقية وظيفية فقط
من أساليب النمو المهني الذاتي للمعلم:|القراءة الموجهة والبحث الإجرائي|انتظار توجيهات المشرف فقط|تجنب الزيارات الصفية|الاكتفاء بالخبرة السابقة
الزيارات الصفية المتبادلة بين المعلمين تهدف إلى:|تبادل الخبرات وتحسين الأداء|تقويم الزملاء بغرض العقاب|إضاعة وقت الحصص|الحكم على شخصياتهم
البحث الإجرائي هو بحث يجريه المعلم:|لحل مشكلة تواجهه في صفه|للحصول على درجة علمية فقط|لنشره في الصحف|لتقويم زملائه
مراجعة المعلم لممارساته التدريسية لتحسينها تسمى:|التأمل في التدريس|التلقين|التسميع|الإملاء
ملف الإنجاز (البورتفوليو) للطالب هو:|مجموعة منتقاة من أعماله تعكس تقدمه|اختبار تحريري نهائي|سجل الحضور والغياب|قائمة بدرجات الاختبارات فقط
يقيس الاختبار الصادق:|ما وُضع لقياسه فعلًا|أي شيء عشوائي|الحفظ فقط|ما يريده المصحح
يعني ثبات الاختبار:|الحصول على نتائج متقاربة عند إعادة تطبيقه|سهولة أسئلته|تنوع أسئلته|قصر زمنه
الأداة التي تضمن توازن الاختبار وتوزع الأسئلة على الأهداف والمحتوى:|جدول المواصفات|سلم التقدير|قائمة الشطب|ملف الإنجاز
التغذية الراجعة هي:|معلومات يقدمها المعلم للطالب عن مستوى أدائه|الدرجة النهائية فقط|عقوبة للمقصّرين|مكافأة مادية
الاختبار الذي يقارن أداء الطالب بأداء أقرانه يسمى اختبارًا:|مرجعي المعيار|مرجعي المحك|تشخيصيًا فقط|شفويًا فقط
الطالب ذو الذكاء الطبيعي ويعاني صعوبة محددة في القراءة أو الكتابة يُصنف من ذوي:|صعوبات التعلم|الإعاقة العقلية|الموهبة|التفوق الدراسي
أنسب برامج رعاية الموهوبين:|برامج الإثراء|تكرار المنهج نفسه|تقليل الأنشطة|تجاهل قدراتهم
من أخلاقيات مهنة التعليم:|المحافظة على سرية معلومات الطلاب|نشر درجات الطلاب علنًا|المفاضلة بين الطلاب|إفشاء أسرار أولياء الأمور
أنسب تواصل مع ولي الأمر:|تواصل إيجابي ومستمر يخدم مصلحة الطالب|التواصل عند المشكلات فقط|تجنب التواصل نهائيًا|الشكوى المتكررة
`;
const Q=RAW.trim().split('\n').map(l=>{const p=l.split('|');return{q:p[0],a:p[1],o:p.slice(1)}});
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const $=document.getElementById('app');
let qs,i,score,wrong;
function start(n){qs=sh(Q).slice(0,n).map(x=>({...x,o:sh(x.o)}));i=0;score=0;wrong=[];show()}
function home(){
$.innerHTML=`<div class="card"><p>تدرّب على أسئلة اختيار متعدد في القسم التربوي (نظريات التعلم، أنواع المعلمين، التقويم، الأهداف، الاستراتيجيات، النمو المهني). يظهر لك الصواب والخطأ فور الإجابة.</p>
<p>عدد الأسئلة المتاح: <b>${Q.length}</b></p>
<label>عدد أسئلة هذه المحاولة: <select id="n">${[20,40,Q.length].filter((v,k,a)=>a.indexOf(v)===k).map(v=>`<option value="${v}">${v===Q.length?'الكل ('+v+')':v}</option>`).join('')}</select></label><br>
<button class="main" onclick="start(+document.getElementById('n').value)">ابدأ الاختبار</button></div>`}
function show(){
if(i>=qs.length)return end();
const x=qs[i];
$.innerHTML=`<div class="meta"><span>سؤال ${i+1} من ${qs.length}</span><span>الدرجة: ${score}</span></div>
<div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
<div class="card"><div class="q">${x.q}</div><div id="os">${x.o.map((t,k)=>`<button class="opt" data-k="${k}">${t}</button>`).join('')}</div><div id="nx"></div></div>`;
$.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b))}
function pick(b){
const x=qs[i],t=b.textContent,ok=t===x.a;
if(ok)score++;else wrong.push(x);
$.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o.textContent===x.a)o.classList.add('ok')});
if(!ok)b.classList.add('no');
document.getElementById('nx').innerHTML=`<button class="main" id="nb">${i+1<qs.length?'السؤال التالي':'عرض النتيجة'}</button>`;
document.getElementById('nb').onclick=()=>{i++;show()}}
function end(){
const p=Math.round(score/qs.length*100);
$.innerHTML=`<div class="card"><div class="big">${p}%</div><p style="text-align:center">أجبت صحيحًا عن ${score} من ${qs.length}</p>
<button class="main" onclick="start(qs.length)">إعادة المحاولة</button> <button class="main" onclick="home()">الرئيسية</button></div>
${wrong.length?`<div class="card"><b>راجع أخطاءك:</b>${wrong.map(w=>`<div class="rv">${w.q}<br><b>الصواب: ${w.a}</b></div>`).join('')}</div>`:''}`}
home();
</script>
</body>
</html>
